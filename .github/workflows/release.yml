name: Build Windows installer

# Builds the installer on every push to main and publishes it as release v<version from package.json>.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ascandir - CharacterEditor ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/Ascandir-CharacterEditor-Setup-*.exe
          fail_on_unmatched_files: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/Ascandir-CharacterEditor-Setup-*.exe
